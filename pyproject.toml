[project]
name = "single-cell-fm-probing"
version = "0.2.0"
description = "Do the cell states single-cell foundation models learn stratify cancer patients better than a linear baseline? scGPT / Geneformer vs HVG-PCA, reverse-translated into TCGA survival, read against a ladder of nulls, floors and references."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "matplotlib>=3.11.0",
    "scanpy>=1.10",
    "anndata>=0.10",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "lifelines>=0.29",
    "joblib>=1.4",
    # unpinned, uv backtracks to llvmlite 0.36, which is Python <3.10 only
    "numba>=0.61",
    "llvmlite>=0.44",
]

[project.optional-dependencies]
# Geneformer and the HVG-PCA baseline; scGPT runs in its own environment (envs/scgpt)
embed = [
    "torch>=2.2",
    "transformers>=4.44",
    "huggingface-hub>=0.24",
]
# the Census atlas query and seurat_v3 HVG selection
data = [
    "cellxgene-census>=1.15",
    "scikit-misc>=0.3",
]

[project.scripts]
scfm = "scfm.cli:main"

[dependency-groups]
# huggingface-hub lets the Geneformer tokeniser test fetch its dictionaries without the embed extra
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "huggingface-hub>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hf: needs the Geneformer V1 dictionaries from Hugging Face; skipped when they cannot be loaded",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs/site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# compact one-line statements and small lambdas are the house style in the stage scripts
ignore = ["E701", "E702", "E731", "E741", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/scfm/scgpt_worker.py" = ["UP"]
# matplotlib.use("Agg") runs before pyplot is imported
"src/scfm/stages/report.py" = ["I001"]
