[project]
name = "single-cell-fm-probing"
version = "0.2.0"
description = "Do the cell states single-cell foundation models learn stratify cancer patients better than a linear baseline? scGPT / Geneformer vs HVG-PCA, reverse-translated into TCGA survival, read against a ladder of nulls, floors and references."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # numerics / probes
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "matplotlib>=3.11.0",
    "rich>=13.7",
    # single-cell data
    "scanpy>=1.10",
    "anndata>=0.10",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "cellxgene-census>=1.15",
    # survival
    "lifelines>=0.29",
    # foundation models (light CPU checkpoints)
    "torch>=2.2",
    "transformers>=4.44",
    "huggingface-hub>=0.24",
    # Pin the numba/llvmlite stack to Python-3.12-compatible versions
    # (unpinned, uv backtracks to llvmlite 0.36 which is Python <3.10 only).
    "numba>=0.61",
    "llvmlite>=0.44",
]

# scGPT carries version-sensitive dependencies (flash-attn optional) and is installed per its
# own instructions behind stage 02; Geneformer's tokenizer comes from its HuggingFace repo.
# Neither is in the base install so a failure to build one never blocks the baseline arm.
